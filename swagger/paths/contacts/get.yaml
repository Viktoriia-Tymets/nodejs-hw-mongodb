tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Returns a list of all contacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      enum: [name, isFavourite, contactType]
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - contacts
                - page
                - perPage
                - totalPages
                - totalContacts
              properties:
                contacts:
                  type: array
                  items:
                    $ref: '#/components/schemas/Contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalPages:
                  type: integer
                  example: 3
                totalContacts:
                  type: integer
                  example: 30
  '400':
    description: Invalid query parameters
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid query parameters
  '404':
    description: Contacts not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contacts not found
