tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update contact by Id
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: ID of the contact to update
    schema:
      type: string
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Lili Bon
          email:
            type: string
            format: email
            example: lilibon78@gmail.com
          phoneNumber:
            type: string
            example: "+380936439567"
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: [home, work, personal]
          photo:
            type: string
            format: binary  
responses:
  '200':
    description: Successfully updated a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: '#/components/schemas/Contact'
  '400':
    description: Invalid data
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid request body
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
