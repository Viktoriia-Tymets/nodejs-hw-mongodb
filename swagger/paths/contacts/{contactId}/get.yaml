tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Retrieve detailed information about a specific contact by its unique ID.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: ID of the contact to retrieve
    schema:
      type: string
responses:
  '200':
    description: Successfully found contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with {contactId}
            data:
              $ref: '#/components/schemas/Contact'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
