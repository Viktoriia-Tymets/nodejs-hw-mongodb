tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact to the book
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: '../../components/schemas/Contact.yaml'

responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created contact!
            data:
              $ref: '../../components/schemas/Contact.yaml'
  '400':
    description: Invalid request body








