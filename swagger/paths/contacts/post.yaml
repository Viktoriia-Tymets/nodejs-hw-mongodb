tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Add a new contact to the book
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Kate Lim
          email:
            type: string
            format: email
            example: kate678@gmail.com
          phoneNumber:
            type: string
            example: "+380935209360"
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: [home, work, personal]
          photo:
            type: string
            format: binary 
        required:
          - name
          - email
responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created contact!
            data:
              $ref: ../../components/schemas/Contact.yaml
  '400':
    description: Invalid request body
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Invalid request body









