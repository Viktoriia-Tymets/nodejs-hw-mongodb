get:
  tags:
    - Contacts
  summary: Get list of contacts
  operationId: getContacts
  description: Retrieve contacts from the list
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      required: true
      description: Id of the contact to retrieve
      schema:
        type: string
  responses:
    '200':
      description: Contact found successfully
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/Contact.yaml'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Contact not found

