tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: Retrieve contacts from the list with pagination
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    description: Page number for pagination
    schema:
      type: integer
      minimum: 1
responses:
  '200':
    description: Contacts retrieved successfully
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '/swagger/components/schemas/Contact'
  '404':
    description: Contacts not found
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Contacts not found




