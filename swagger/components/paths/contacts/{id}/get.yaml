get:
  summary: Get contact by id
  description: Retrieve a single contact by its unique id
  tags:
    - Contacts
  parameters:
    - name: id
      in: path
      required: true
      description: Unique ID of the contact
      schema:
        type: string
        example: 68962e8e5ae0a5402d96f9b6
  responses:
    '200':
      description: Successfully found contact by id
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/contact.yaml'
            401':
    $ref: ../../../components/responses/401.yaml
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Contact not found
    '500':
      description: Server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Internal server error
