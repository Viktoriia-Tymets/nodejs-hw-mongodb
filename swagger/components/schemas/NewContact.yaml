NewContact:
  type: object
  properties:
    name:
      type: string
      example: John Doe
    phoneNumber:
      type: string
      example: "+123456789"
    email:
      type: string
      format: email
    isFavourite:
      type: boolean
      default: false
    contactType:
      type: string
      enum: [work, home, personal]
      default: personal
    photo:
      type: string
  required:
    - name
    - phoneNumber
    - contactType
