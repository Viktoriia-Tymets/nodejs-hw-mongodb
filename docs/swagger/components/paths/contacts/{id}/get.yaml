tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Retrieve detailed information about a specific contact by its unique ID.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: ID of the contact to retrieve
    schema:
      type: string
responses:
  '200':
    description: Contact found successfully
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Contact.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found

