openapi: 3.0.3
info:
  version: 1.0.0
  title: Contact book
  description: This is contact book
tags:
  - name: Contacts
    description: Operation with contacts
servers:
  - url: https://nodejs-hw-mongodb-7-wywt.onrender.com
  - url: http://127.0.0.1:8080
paths:
  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{contactId}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{contactId}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{contactId}/delete.yaml

  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
